<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dino Runner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }
    .header {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .title {
      font-size: 24px;
      font-weight: 800;
      color: #fbbf24;
      letter-spacing: 1px;
    }
    .stats {
      font-family: monospace;
      font-size: 16px;
      font-weight: 700;
      color: #94a3b8;
    }
    .stats span { color: #fbbf24; }
    .canvas-wrap {
      position: relative;
      border: 3px solid #f59e0b;
      border-radius: 8px;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.25);
      background: #020617;
    }
    canvas { display: block; }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(3, 7, 18, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .overlay.hidden { display: none; }
    .btn {
      background: #f59e0b;
      color: #030712;
      border: none;
      padding: 10px 24px;
      font-size: 15px;
      font-weight: 800;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:hover { background: #fbbf24; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">DINO JUMP</div>
    <div class="stats">HI <span id="hi">00000</span> &nbsp; <span id="score">00000</span></div>
  </div>

  <div class="canvas-wrap" id="box">
    <canvas id="c" width="500" height="200"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="msg" style="color: #fbbf24; font-size: 24px;">PRESS SPACE TO RUN</h2>
      <p style="color: #cbd5e1; font-size: 13px;">Tap screen or press Space / Up to jump</p>
      <button class="btn" onclick="start()">START</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    let hi = parseInt(localStorage.getItem('dino_hi') || '0', 10);
    document.getElementById('hi').innerText = String(hi).padStart(5, '0');

    let dino = { x: 40, y: 150, w: 22, h: 28, vy: 0, grounded: true };
    const gravity = 0.65;
    const jumpForce = -11;
    let obstacles = [];
    let speed = 4.5;
    let score = 0;
    let running = false;
    let frame = 0;

    function beep(freq, dur) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e){}
    }

    function jump() {
      if (!running) {
        start();
        return;
      }
      if (dino.grounded) {
        dino.vy = jumpForce;
        dino.grounded = false;
        beep(520, 0.08);
      }
    }

    function start() {
      dino.y = 150;
      dino.vy = 0;
      dino.grounded = true;
      obstacles = [];
      score = 0;
      speed = 4.5;
      frame = 0;
      running = true;
      document.getElementById('overlay').classList.add('hidden');
    }

    function gameOver() {
      running = false;
      beep(160, 0.25);
      if (score > hi) {
        hi = score;
        localStorage.setItem('dino_hi', hi);
        document.getElementById('hi').innerText = String(hi).padStart(5, '0');
      }
      document.getElementById('msg').innerText = "GAME OVER";
      document.getElementById('overlay').classList.remove('hidden');
    }

    function update() {
      if (!running) return;

      frame++;
      score++;
      if (score % 500 === 0) {
        speed += 0.4;
        beep(800, 0.15);
      }
      document.getElementById('score').innerText = String(score).padStart(5, '0');

      // Physics
      dino.vy += gravity;
      dino.y += dino.vy;

      if (dino.y >= 150) {
        dino.y = 150;
        dino.vy = 0;
        dino.grounded = true;
      }

      // Spawn cacti
      if (frame % Math.floor(75 - Math.min(30, speed * 2)) === 0 && Math.random() < 0.8) {
        const h = Math.random() > 0.5 ? 26 : 36;
        obstacles.push({
          x: canvas.width,
          y: 178 - h,
          w: 14,
          h: h
        });
      }

      // Move obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        let ob = obstacles[i];
        ob.x -= speed;

        // Collision check
        if (dino.x + 4 < ob.x + ob.w &&
            dino.x + dino.w - 4 > ob.x &&
            dino.y + dino.h > ob.y) {
          return gameOver();
        }

        if (ob.x < -30) obstacles.splice(i, 1);
      }
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Ground
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 178);
      ctx.lineTo(canvas.width, 178);
      ctx.stroke();

      // Dino (pixel art green t-rex)
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(dino.x, dino.y, dino.w, dino.h);
      ctx.fillRect(dino.x + 12, dino.y - 6, 12, 12); // head
      ctx.fillStyle = '#020617';
      ctx.fillRect(dino.x + 18, dino.y - 3, 3, 3); // eye

      // Legs animation
      ctx.fillStyle = '#16a34a';
      if (!dino.grounded) {
        ctx.fillRect(dino.x + 2, dino.y + dino.h, 4, 4);
      } else {
        if (Math.floor(frame / 6) % 2 === 0) {
          ctx.fillRect(dino.x + 2, dino.y + dino.h, 4, 6);
          ctx.fillRect(dino.x + 14, dino.y + dino.h, 4, 3);
        } else {
          ctx.fillRect(dino.x + 2, dino.y + dino.h, 4, 3);
          ctx.fillRect(dino.x + 14, dino.y + dino.h, 4, 6);
        }
      }

      // Cacti
      ctx.fillStyle = '#f59e0b';
      obstacles.forEach(ob => {
        ctx.fillRect(ob.x, ob.y, ob.w, ob.h);
        // arms
        ctx.fillRect(ob.x - 4, ob.y + 6, 4, ob.h / 2);
        ctx.fillRect(ob.x + ob.w, ob.y + 8, 4, ob.h / 2);
      });
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        jump();
      }
    });

    document.getElementById('box').addEventListener('pointerdown', e => {
      e.preventDefault();
      jump();
    });

    loop();
  </script>
</body>
</html>

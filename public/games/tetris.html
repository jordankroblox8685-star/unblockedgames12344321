<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tetris Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }
    .wrapper {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .board-container {
      position: relative;
      border: 3px solid #6366f1;
      border-radius: 8px;
      background: #020617;
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.3);
    }
    canvas#tetris {
      display: block;
      background: #030712;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 120px;
    }
    .panel {
      background: #111827;
      border: 1px solid #1f293d;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .panel-label {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .panel-val {
      font-family: monospace;
      font-size: 18px;
      font-weight: 800;
      color: #38bdf8;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(3, 7, 18, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .overlay.hidden { display: none; }
    .btn {
      background: #6366f1;
      color: white;
      border: none;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:hover { background: #4f46e5; }
    .mobile-controls {
      display: grid;
      grid-template-columns: repeat(4, 52px);
      gap: 6px;
      margin-top: 14px;
    }
    .ctrl-btn {
      height: 44px;
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      font-weight: bold;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    .ctrl-btn:active { background: #6366f1; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="board-container">
      <canvas id="tetris" width="240" height="480"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="msg" style="color: #818cf8; font-size: 22px;">TETRIS</h2>
        <button class="btn" onclick="start()">START</button>
      </div>
    </div>
    <div class="sidebar">
      <div class="panel">
        <div class="panel-label">Score</div>
        <div class="panel-val" id="score">0</div>
      </div>
      <div class="panel">
        <div class="panel-label">Lines</div>
        <div class="panel-val" id="lines">0</div>
      </div>
      <div class="panel">
        <div class="panel-label">Level</div>
        <div class="panel-val" id="level">1</div>
      </div>
      <div class="panel">
        <div class="panel-label">Next</div>
        <canvas id="next" width="80" height="80" style="margin: 0 auto; display:block;"></canvas>
      </div>
      <button class="btn" onclick="start()" style="background:#334155; font-size:12px;">Reset</button>
    </div>
  </div>

  <div class="mobile-controls">
    <button class="ctrl-btn" onclick="playerMove(-1)">◀</button>
    <button class="ctrl-btn" onclick="playerRotate()">↻</button>
    <button class="ctrl-btn" onclick="playerMove(1)">▶</button>
    <button class="ctrl-btn" onclick="playerDrop()">▼</button>
  </div>

  <script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    context.scale(24, 24);

    const nextCanvas = document.getElementById('next');
    const nextContext = nextCanvas.getContext('2d');
    nextContext.scale(20, 20);

    const colors = [
      null,
      '#e11d48', // T
      '#06b6d4', // I
      '#f59e0b', // O
      '#10b981', // S
      '#8b5cf6', // Z
      '#3b82f6', // J
      '#ea580c'  // L
    ];

    function createPiece(type) {
      if (type === 'T') {
        return [
          [0, 1, 0],
          [1, 1, 1],
          [0, 0, 0],
        ];
      } else if (type === 'I') {
        return [
          [0, 2, 0, 0],
          [0, 2, 0, 0],
          [0, 2, 0, 0],
          [0, 2, 0, 0],
        ];
      } else if (type === 'O') {
        return [
          [3, 3],
          [3, 3],
        ];
      } else if (type === 'S') {
        return [
          [0, 4, 4],
          [4, 4, 0],
          [0, 0, 0],
        ];
      } else if (type === 'Z') {
        return [
          [5, 5, 0],
          [0, 5, 5],
          [0, 0, 0],
        ];
      } else if (type === 'J') {
        return [
          [0, 6, 0],
          [0, 6, 0],
          [6, 6, 0],
        ];
      } else if (type === 'L') {
        return [
          [0, 7, 0],
          [0, 7, 0],
          [0, 7, 7],
        ];
      }
    }

    const arena = createMatrix(10, 20);

    const player = {
      pos: {x: 0, y: 0},
      matrix: null,
      score: 0,
      lines: 0,
      level: 1
    };

    let nextPieceType = null;
    let isRunning = false;

    function createMatrix(w, h) {
      const matrix = [];
      while (h--) {
        matrix.push(new Array(w).fill(0));
      }
      return matrix;
    }

    function collide(arena, player) {
      const [m, o] = [player.matrix, player.pos];
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 &&
              (arena[y + o.y] &&
              arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    function drawMatrix(matrix, offset, ctx = context) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            ctx.fillStyle = colors[value];
            ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
            ctx.lineWidth = 0.05;
            ctx.strokeStyle = '#000';
            ctx.strokeRect(x + offset.x, y + offset.y, 1, 1);
          }
        });
      });
    }

    function drawNext() {
      nextContext.fillStyle = '#111827';
      nextContext.fillRect(0, 0, 4, 4);
      if (nextPieceType) {
        const mat = createPiece(nextPieceType);
        drawMatrix(mat, {x: 0.5, y: 0.5}, nextContext);
      }
    }

    function draw() {
      context.fillStyle = '#030712';
      context.fillRect(0, 0, canvas.width, canvas.height);

      drawMatrix(arena, {x: 0, y: 0});
      drawMatrix(player.matrix, player.pos);
    }

    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    function arenaSweep() {
      let rowCount = 1;
      outer: for (let y = arena.length - 1; y > 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
          if (arena[y][x] === 0) {
            continue outer;
          }
        }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;

        player.score += rowCount * 100;
        player.lines++;
        rowCount *= 2;
      }
      player.level = Math.floor(player.lines / 10) + 1;
      updateScore();
    }

    function playerDrop() {
      if (!isRunning) return;
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
      }
      dropCounter = 0;
    }

    function playerMove(dir) {
      if (!isRunning) return;
      player.pos.x += dir;
      if (collide(arena, player)) {
        player.pos.x -= dir;
      }
    }

    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [
            matrix[x][y],
            matrix[y][x],
          ] = [
            matrix[y][x],
            matrix[x][y],
          ];
        }
      }
      if (dir > 0) {
        matrix.forEach(row => row.reverse());
      } else {
        matrix.reverse();
      }
    }

    function playerRotate() {
      if (!isRunning) return;
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, 1);
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -1);
          player.pos.x = pos;
          return;
        }
      }
    }

    const pieces = 'ILJOTSZ';
    function getRandomPiece() {
      return pieces[pieces.length * Math.random() | 0];
    }

    function playerReset() {
      if (!nextPieceType) nextPieceType = getRandomPiece();
      player.matrix = createPiece(nextPieceType);
      nextPieceType = getRandomPiece();
      drawNext();

      player.pos.y = 0;
      player.pos.x = (arena[0].length / 2 | 0) -
                     (player.matrix[0].length / 2 | 0);

      if (collide(arena, player)) {
        arena.forEach(row => row.fill(0));
        isRunning = false;
        document.getElementById('msg').innerText = "GAME OVER";
        document.getElementById('overlay').classList.remove('hidden');
      }
    }

    function updateScore() {
      document.getElementById('score').innerText = player.score;
      document.getElementById('lines').innerText = player.lines;
      document.getElementById('level').innerText = player.level;
    }

    let dropCounter = 0;
    let dropInterval = 800;
    let lastTime = 0;

    function update(time = 0) {
      if (isRunning) {
        const deltaTime = time - lastTime;
        lastTime = time;

        dropCounter += deltaTime;
        const currentDropInterval = Math.max(150, dropInterval - (player.level - 1) * 60);
        if (dropCounter > currentDropInterval) {
          playerDrop();
        }
        draw();
      }
      requestAnimationFrame(update);
    }

    function start() {
      arena.forEach(row => row.fill(0));
      player.score = 0;
      player.lines = 0;
      player.level = 1;
      updateScore();
      document.getElementById('overlay').classList.add('hidden');
      isRunning = true;
      nextPieceType = getRandomPiece();
      playerReset();
    }

    window.addEventListener('keydown', event => {
      if (['ArrowLeft', 'ArrowRight', 'ArrowDown', 'ArrowUp', ' '].includes(event.key)) {
        event.preventDefault();
      }
      if (event.key === 'ArrowLeft') playerMove(-1);
      else if (event.key === 'ArrowRight') playerMove(1);
      else if (event.key === 'ArrowDown') playerDrop();
      else if (event.key === 'ArrowUp') playerRotate();
      else if (event.key === ' ') {
        while (!collide(arena, player)) {
          player.pos.y++;
        }
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
      }
    });

    update();
  </script>
</body>
</html>

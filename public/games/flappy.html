<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flappy Sky Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }
    .header {
      width: 100%;
      max-width: 360px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .title {
      font-size: 24px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 0.5px;
    }
    .stats {
      font-size: 14px;
      font-weight: 700;
      color: #94a3b8;
    }
    .stats span { color: #f59e0b; font-family: monospace; font-size: 16px; }
    .game-box {
      position: relative;
      width: 360px;
      height: 520px;
      border: 3px solid #0284c7;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(2, 132, 199, 0.25);
      background: #0c4a6e;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #075985;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(8, 47, 73, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .overlay.hidden { display: none; }
    .btn {
      background: #f59e0b;
      color: #0f172a;
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 800;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
    }
    .btn:hover { background: #fbbf24; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">FLAPPY SKY</div>
    <div class="stats">BEST: <span id="best">0</span></div>
  </div>

  <div class="game-box" id="box">
    <canvas id="c" width="360" height="520"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="msg" style="color: #38bdf8; font-size: 28px; font-weight: 800;">TAP TO FLY</h2>
      <p style="color: #cbd5e1; font-size: 14px;">Press Space / Click / Tap to jump</p>
      <button class="btn" id="start-btn" onclick="startGame()">START</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let best = parseInt(localStorage.getItem('flappy_best') || '0', 10);
    document.getElementById('best').innerText = best;

    let bird = { x: 60, y: 240, vy: 0, rad: 14 };
    let gravity = 0.38;
    let jump = -6.5;
    let pipes = [];
    let frame = 0;
    let score = 0;
    let gameState = 'start'; // 'start', 'playing', 'dead'

    function beep(freq, duration) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e){}
    }

    function reset() {
      bird.y = 240;
      bird.vy = 0;
      pipes = [];
      score = 0;
      frame = 0;
    }

    function flap() {
      if (gameState === 'playing') {
        bird.vy = jump;
        beep(440, 0.08);
      } else if (gameState === 'start' || gameState === 'dead') {
        startGame();
      }
    }

    function startGame() {
      reset();
      gameState = 'playing';
      document.getElementById('overlay').classList.add('hidden');
    }

    function gameOver() {
      gameState = 'dead';
      beep(180, 0.3);
      if (score > best) {
        best = score;
        localStorage.setItem('flappy_best', best);
        document.getElementById('best').innerText = best;
      }
      document.getElementById('msg').innerText = "SCORE: " + score;
      document.getElementById('start-btn').innerText = "PLAY AGAIN";
      document.getElementById('overlay').classList.remove('hidden');
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function update() {
      if (gameState !== 'playing') return;

      frame++;
      bird.vy += gravity;
      bird.y += bird.vy;

      // floor / ceiling
      if (bird.y + bird.rad > canvas.height - 30 || bird.y - bird.rad < 0) {
        return gameOver();
      }

      // spawn pipes
      if (frame % 90 === 0) {
        const gap = 120;
        const topH = Math.floor(Math.random() * (canvas.height - 180 - gap)) + 40;
        pipes.push({
          x: canvas.width,
          top: topH,
          bottom: topH + gap,
          passed: false
        });
      }

      // update pipes
      for (let i = pipes.length - 1; i >= 0; i--) {
        let p = pipes[i];
        p.x -= 2.2;

        // collision check
        if (bird.x + bird.rad > p.x && bird.x - bird.rad < p.x + 50) {
          if (bird.y - bird.rad < p.top || bird.y + bird.rad > p.bottom) {
            return gameOver();
          }
        }

        // score count
        if (!p.passed && p.x + 50 < bird.x) {
          p.passed = true;
          score++;
          beep(620, 0.1);
        }

        if (p.x < -60) pipes.splice(i, 1);
      }
    }

    function draw() {
      // background
      ctx.fillStyle = '#075985';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // clouds
      ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.beginPath();
      ctx.arc(80, 100, 30, 0, Math.PI * 2);
      ctx.arc(110, 90, 40, 0, Math.PI * 2);
      ctx.arc(150, 100, 30, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(260, 160, 25, 0, Math.PI * 2);
      ctx.arc(290, 150, 35, 0, Math.PI * 2);
      ctx.arc(320, 160, 25, 0, Math.PI * 2);
      ctx.fill();

      // pipes
      pipes.forEach(p => {
        ctx.fillStyle = '#10b981';
        ctx.strokeStyle = '#064e3b';
        ctx.lineWidth = 3;

        // top pipe
        ctx.fillRect(p.x, 0, 50, p.top);
        ctx.strokeRect(p.x, 0, 50, p.top);
        ctx.fillRect(p.x - 3, p.top - 20, 56, 20);
        ctx.strokeRect(p.x - 3, p.top - 20, 56, 20);

        // bottom pipe
        ctx.fillRect(p.x, p.bottom, 50, canvas.height - p.bottom);
        ctx.strokeRect(p.x, p.bottom, 50, canvas.height - p.bottom);
        ctx.fillRect(p.x - 3, p.bottom, 56, 20);
        ctx.strokeRect(p.x - 3, p.bottom, 56, 20);
      });

      // ground
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
      ctx.fillStyle = '#10b981';
      ctx.fillRect(0, canvas.height - 30, canvas.width, 4);

      // bird (yellow flappy bird with eye and beak)
      ctx.save();
      ctx.translate(bird.x, bird.y);
      let angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (bird.vy * 4) * Math.PI / 180));
      ctx.rotate(angle);

      // body
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.arc(0, 0, bird.rad, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#b45309';
      ctx.lineWidth = 2;
      ctx.stroke();

      // eye
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(5, -4, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(7, -4, 2, 0, Math.PI * 2);
      ctx.fill();

      // beak
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.moveTo(10, -1);
      ctx.lineTo(18, 2);
      ctx.lineTo(10, 5);
      ctx.fill();

      // wing
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.arc(-5, 2, 6, 0, Math.PI);
      ctx.fill();

      ctx.restore();

      // score in play
      if (gameState === 'playing') {
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 36px monospace';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 4;
        ctx.fillText(score, canvas.width / 2, 60);
        ctx.shadowBlur = 0;
      }
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        flap();
      }
    });

    document.getElementById('box').addEventListener('pointerdown', e => {
      e.preventDefault();
      flap();
    });

    loop();
  </script>
</body>
</html>

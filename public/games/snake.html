<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Retro Neon Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .header {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .title {
      font-size: 26px;
      font-weight: 800;
      color: #10b981;
      letter-spacing: 1px;
    }
    .stats {
      display: flex;
      gap: 12px;
      font-size: 14px;
      font-weight: 600;
    }
    .stat-val { color: #38bdf8; font-family: monospace; font-size: 16px; }
    .canvas-wrap {
      position: relative;
      border: 3px solid #10b981;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.25);
      background: #020617;
      overflow: hidden;
    }
    canvas {
      display: block;
      background: #030712;
    }
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(3, 7, 18, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .overlay.hidden { display: none; }
    .btn {
      background: #10b981;
      color: #030712;
      border: none;
      padding: 10px 24px;
      font-size: 15px;
      font-weight: 800;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
    }
    .btn:hover { background: #34d399; }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      gap: 8px;
      margin-top: 14px;
    }
    .d-pad-btn {
      width: 60px;
      height: 48px;
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      border-radius: 6px;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .d-pad-btn:active { background: #10b981; color: #020617; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">SNAKE</div>
    <div class="stats">
      <div>SCORE: <span class="stat-val" id="score">0</span></div>
      <div>BEST: <span class="stat-val" id="best">0</span></div>
    </div>
  </div>

  <div class="canvas-wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="over-title" style="color: #10b981; font-size: 26px;">READY TO PLAY?</h2>
      <p style="color: #94a3b8; font-size: 13px;">Use Arrow keys, WASD, or D-pad</p>
      <button class="btn" id="start-btn" onclick="startGame()">START GAME</button>
    </div>
  </div>

  <div class="controls">
    <div></div>
    <button class="d-pad-btn" onclick="changeDir('up')">▲</button>
    <div></div>
    <button class="d-pad-btn" onclick="changeDir('left')">◀</button>
    <button class="d-pad-btn" onclick="changeDir('down')">▼</button>
    <button class="d-pad-btn" onclick="changeDir('right')">▶</button>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const grid = 20;
    const count = canvas.width / grid;

    let snake = [];
    let dx = grid, dy = 0;
    let food = {x: 10, y: 10};
    let score = 0;
    let best = parseInt(localStorage.getItem('snake_best') || '0', 10);
    let loopId = null;
    let running = false;
    let nextDir = 'right';

    document.getElementById('best').innerText = best;

    function beep(freq, duration) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e){}
    }

    function resetGame() {
      snake = [
        {x: 10 * grid, y: 10 * grid},
        {x: 9 * grid, y: 10 * grid},
        {x: 8 * grid, y: 10 * grid}
      ];
      dx = grid;
      dy = 0;
      nextDir = 'right';
      score = 0;
      document.getElementById('score').innerText = score;
      placeFood();
    }

    function placeFood() {
      food.x = Math.floor(Math.random() * count) * grid;
      food.y = Math.floor(Math.random() * count) * grid;
      // make sure food not on snake
      for (let s of snake) {
        if (s.x === food.x && s.y === food.y) {
          return placeFood();
        }
      }
    }

    function startGame() {
      resetGame();
      document.getElementById('overlay').classList.add('hidden');
      running = true;
      if (loopId) clearInterval(loopId);
      loopId = setInterval(tick, 100);
    }

    function gameOver() {
      running = false;
      clearInterval(loopId);
      beep(150, 0.4);
      document.getElementById('over-title').innerText = "GAME OVER";
      document.getElementById('start-btn').innerText = "PLAY AGAIN";
      document.getElementById('overlay').classList.remove('hidden');
    }

    function tick() {
      // update direction
      if (nextDir === 'up' && dy === 0) { dx = 0; dy = -grid; }
      if (nextDir === 'down' && dy === 0) { dx = 0; dy = grid; }
      if (nextDir === 'left' && dx === 0) { dx = -grid; dy = 0; }
      if (nextDir === 'right' && dx === 0) { dx = grid; dy = 0; }

      const head = {x: snake[0].x + dx, y: snake[0].y + dy};

      // wall collision
      if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
        return gameOver();
      }

      // self collision
      for (let i = 0; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          return gameOver();
        }
      }

      snake.unshift(head);

      // ate food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').innerText = score;
        if (score > best) {
          best = score;
          localStorage.setItem('snake_best', best);
          document.getElementById('best').innerText = best;
        }
        beep(580, 0.1);
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // clear background
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // subtle grid lines
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += grid) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // draw food (glowing red apple/orb)
      ctx.fillStyle = '#f43f5e';
      ctx.shadowColor = '#f43f5e';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(food.x + grid/2, food.y + grid/2, grid/2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // draw snake
      snake.forEach((segment, index) => {
        if (index === 0) {
          ctx.fillStyle = '#34d399';
          ctx.shadowColor = '#10b981';
          ctx.shadowBlur = 8;
        } else {
          ctx.fillStyle = '#059669';
          ctx.shadowBlur = 0;
        }
        ctx.fillRect(segment.x + 1, segment.y + 1, grid - 2, grid - 2);
      });
      ctx.shadowBlur = 0;
    }

    function changeDir(dir) {
      nextDir = dir;
    }

    window.addEventListener('keydown', e => {
      if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight', 'w','a','s','d'].includes(e.key.toLowerCase())) {
        e.preventDefault();
      }
      const k = e.key.toLowerCase();
      if (k === 'arrowup' || k === 'w') changeDir('up');
      if (k === 'arrowdown' || k === 's') changeDir('down');
      if (k === 'arrowleft' || k === 'a') changeDir('left');
      if (k === 'arrowright' || k === 'd') changeDir('right');
    });

    draw();
  </script>
</body>
</html>

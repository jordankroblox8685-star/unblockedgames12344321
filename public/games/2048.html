<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2048 Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .header {
      width: 100%;
      max-width: 380px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .title {
      font-size: 36px;
      font-weight: 800;
      color: #fbbf24;
      letter-spacing: -1px;
    }
    .scores {
      display: flex;
      gap: 8px;
    }
    .score-box {
      background: #1e293b;
      padding: 6px 12px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #334155;
    }
    .score-label {
      font-size: 10px;
      text-transform: uppercase;
      color: #94a3b8;
      font-weight: 700;
    }
    .score-val {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
    }
    .grid-container {
      width: 100%;
      max-width: 380px;
      height: 380px;
      background: #1e293b;
      border-radius: 12px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-gap: 10px;
      position: relative;
      border: 2px solid #334155;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .cell {
      background: #0f172a;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
      transition: all 0.1s ease;
      color: #fff;
    }
    .val-2 { background: #334155; color: #f8fafc; }
    .val-4 { background: #475569; color: #f8fafc; }
    .val-8 { background: #d97706; color: #fff; }
    .val-16 { background: #ea580c; color: #fff; }
    .val-32 { background: #dc2626; color: #fff; }
    .val-64 { background: #e11d48; color: #fff; }
    .val-128 { background: #f59e0b; color: #fff; font-size: 22px; box-shadow: 0 0 10px #f59e0b; }
    .val-256 { background: #eab308; color: #fff; font-size: 22px; box-shadow: 0 0 12px #eab308; }
    .val-518, .val-512 { background: #84cc16; color: #fff; font-size: 22px; box-shadow: 0 0 14px #84cc16; }
    .val-1024 { background: #06b6d4; color: #fff; font-size: 18px; box-shadow: 0 0 16px #06b6d4; }
    .val-2048 { background: #6366f1; color: #fff; font-size: 18px; box-shadow: 0 0 20px #6366f1; }
    
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 12px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 10;
    }
    .overlay.active { display: flex; }
    .btn {
      background: #6366f1;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #4f46e5; }
    .footer {
      width: 100%;
      max-width: 380px;
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      align-items: center;
    }
    .info {
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">2048</div>
    <div class="scores">
      <div class="score-box">
        <div class="score-label">Score</div>
        <div class="score-val" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">Best</div>
        <div class="score-val" id="best">0</div>
      </div>
    </div>
  </div>

  <div class="grid-container" id="grid">
    <div class="overlay" id="overlay">
      <h2 id="msg" style="font-size: 28px; font-weight: 800;">Game Over!</h2>
      <button class="btn" onclick="init()">Play Again</button>
    </div>
  </div>

  <div class="footer">
    <span class="info">Swipe or use Arrow keys / WASD</span>
    <button class="btn" style="padding: 6px 12px; font-size: 12px; background: #334155;" onclick="init()">New Game</button>
  </div>

  <script>
    let board = [];
    let score = 0;
    let best = parseInt(localStorage.getItem('2048_best') || '0', 10);
    document.getElementById('best').innerText = best;

    function playBeep(freq = 440) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.05, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
      } catch(e){}
    }

    function init() {
      board = Array(4).fill(0).map(() => Array(4).fill(0));
      score = 0;
      updateScore(0);
      document.getElementById('overlay').classList.remove('active');
      addRandomTile();
      addRandomTile();
      render();
    }

    function addRandomTile() {
      let empty = [];
      for(let r=0; r<4; r++){
        for(let c=0; c<4; c++){
          if(board[r][c] === 0) empty.push({r, c});
        }
      }
      if(empty.length > 0) {
        let spot = empty[Math.floor(Math.random() * empty.length)];
        board[spot.r][spot.c] = Math.random() < 0.9 ? 2 : 4;
      }
    }

    function render() {
      const grid = document.getElementById('grid');
      // remove old cells
      grid.querySelectorAll('.cell').forEach(e => e.remove());
      for(let r=0; r<4; r++){
        for(let c=0; c<4; c++){
          const div = document.createElement('div');
          const val = board[r][c];
          div.className = 'cell' + (val > 0 ? ` val-${val}` : '');
          div.innerText = val > 0 ? val : '';
          grid.appendChild(div);
        }
      }
    }

    function updateScore(add) {
      score += add;
      document.getElementById('score').innerText = score;
      if(score > best) {
        best = score;
        localStorage.setItem('2048_best', best);
        document.getElementById('best').innerText = best;
      }
    }

    function slide(row) {
      let arr = row.filter(val => val);
      let missing = 4 - arr.length;
      let zeros = Array(missing).fill(0);
      return arr.concat(zeros);
    }

    function combine(row) {
      for (let i = 0; i < 3; i++) {
        if (row[i] !== 0 && row[i] === row[i + 1]) {
          row[i] *= 2;
          updateScore(row[i]);
          playBeep(220 + row[i] * 2);
          row[i + 1] = 0;
        }
      }
      return row;
    }

    function operate(row) {
      row = slide(row);
      row = combine(row);
      row = slide(row);
      return row;
    }

    function moveLeft() {
      let changed = false;
      for (let i = 0; i < 4; i++) {
        let old = [...board[i]];
        board[i] = operate(board[i]);
        if(old.some((v, idx) => v !== board[i][idx])) changed = true;
      }
      return changed;
    }

    function rotate() {
      let newB = Array(4).fill(0).map(() => Array(4).fill(0));
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          newB[c][3 - r] = board[r][c];
        }
      }
      board = newB;
    }

    function move(dir) {
      let changed = false;
      if (dir === 'left') changed = moveLeft();
      else if (dir === 'down') { rotate(); rotate(); rotate(); changed = moveLeft(); rotate(); }
      else if (dir === 'right') { rotate(); rotate(); changed = moveLeft(); rotate(); rotate(); }
      else if (dir === 'up') { rotate(); changed = moveLeft(); rotate(); rotate(); rotate(); }

      if (changed) {
        addRandomTile();
        render();
        if (checkGameOver()) {
          document.getElementById('msg').innerText = "Game Over!";
          document.getElementById('overlay').classList.add('active');
        }
      }
    }

    function checkGameOver() {
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (board[r][c] === 0) return false;
          if (r < 3 && board[r][c] === board[r + 1][c]) return false;
          if (c < 3 && board[r][c] === board[r][c + 1]) return false;
        }
      }
      return true;
    }

    window.addEventListener('keydown', e => {
      if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight', 'w','a','s','d','W','A','S','D'].includes(e.key)) {
        e.preventDefault();
      }
      if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') move('left');
      if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') move('right');
      if(e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') move('up');
      if(e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') move('down');
    });

    let touchX = 0, touchY = 0;
    window.addEventListener('touchstart', e => {
      touchX = e.touches[0].clientX;
      touchY = e.touches[0].clientY;
    }, {passive: true});

    window.addEventListener('touchend', e => {
      let dx = e.changedTouches[0].clientX - touchX;
      let dy = e.changedTouches[0].clientY - touchY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
        move(dx > 0 ? 'right' : 'left');
      } else if (Math.abs(dy) > 30) {
        move(dy > 0 ? 'down' : 'up');
      }
    }, {passive: true});

    init();
  </script>
</body>
</html>
